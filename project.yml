name: Dimple
options:
  bundleIdPrefix: com.dimple
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Dimple:
    type: application
    platform: macOS
    sources:
      - path: Dimple
        excludes:
          - Resources/Info.plist
          - Resources/Dimple.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dimple.Dimple
        PRODUCT_NAME: Dimple
        INFOPLIST_FILE: Dimple/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dimple/Resources/Dimple.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Dimple:
    build:
      targets:
        Dimple: all
