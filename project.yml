name: Notchy
options:
  bundleIdPrefix: com.notchy
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Notchy:
    type: application
    platform: macOS
    sources:
      - path: Notchy
        excludes:
          - Resources/Info.plist
          - Resources/Notchy.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchy.Notchy
        PRODUCT_NAME: Notchy
        INFOPLIST_FILE: Notchy/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Notchy/Resources/Notchy.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Notchy:
    build:
      targets:
        Notchy: all
